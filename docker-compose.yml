services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: dock-min-postgres
    restart: unless-stopped

    ports:
      - "5434:5432"

    environment:
      POSTGRES_DB: dockmind
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    volumes:
      - docpgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dockmind"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  docpgdata: